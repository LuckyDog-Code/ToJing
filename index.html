<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0820">
  <title>生日快乐</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💌</text></svg>">
  <link rel="preload" href="assets/fonts/wenkai-regular.woff" as="font" type="font/woff" crossorigin>
  <link rel="preload" href="assets/fonts/greatvibes.woff" as="font" type="font/woff" crossorigin>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="locked">
  <!-- 背景：静态星云 + Canvas 星空 -->
  <div class="nebula" aria-hidden="true"></div>
  <canvas id="sky" aria-hidden="true"></canvas>

  <audio id="bgm" src="assets/music.mp3" preload="auto" loop playsinline></audio>

  <button id="music-btn" class="music-btn" aria-label="暂停/播放音乐">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="12" cy="12" r="3" fill="currentColor"/><path d="M12 2a10 10 0 0 1 10 10" fill="none" stroke="currentColor" stroke-width="1.5" opacity=".5"/></svg>
  </button>

  <main>
    <!-- 1. 开场 -->
    <section id="intro" class="intro">
      <h1 class="intro-title" id="intro-title">Happy Birthday</h1>
      <p class="intro-name" id="intro-name"></p>
      <button id="start-btn" class="start-btn"></button>
      <div class="scroll-hint" id="scroll-hint">
        <span>向下滑动</span>
        <i></i>
      </div>
    </section>

    <!-- 2 + 3. 信封飞近、打开（固定画面） -->
    <section id="envelope-section" class="envelope-section">
      <div class="floaters" id="floaters" aria-hidden="true"></div>
      <div class="stage">
        <div class="envelope" id="envelope">
          <div class="env-back"></div>
          <div class="env-paper" id="env-paper"></div>
          <div class="env-front"><span class="env-label" id="env-label"></span></div>
          <div class="env-flap" id="env-flap"></div>
          <div class="seal" id="seal">
            <div class="seal-half seal-whole"><svg viewBox="0 0 100 100"><use href="#heart-seal"/></svg></div>
            <div class="seal-half seal-t"><svg viewBox="0 0 100 100"><use href="#heart-seal"/></svg></div>
            <div class="seal-half seal-b"><svg viewBox="0 0 100 100"><use href="#heart-seal"/></svg></div>
          </div>
        </div>
      </div>
    </section>

    <!-- 4. 信 -->
    <section id="letter-section" class="letter-section">
      <article class="letter-card" id="letter-card">
        <h2 class="letter-greeting" id="letter-greeting"></h2>
        <div class="letter-body" id="letter-body"></div>
        <p class="letter-closing" id="letter-closing"></p>
        <footer class="letter-sign">
          <p id="letter-signoff"></p>
          <p class="letter-from" id="letter-from"></p>
          <p class="letter-date"><span id="letter-date"></span></p>
        </footer>
      </article>
    </section>

    <!-- 5. 蛋糕 -->
    <section id="cake-section" class="cake-section">
      <div class="cake-wrap" id="cake-wrap">
        <div class="cake-display">
        <div class="candles" id="candles">
          <div class="candle"><div class="flame"></div><div class="smoke"></div></div>
          <div class="candle"><div class="flame"></div><div class="smoke"></div></div>
          <div class="candle"><div class="flame"></div><div class="smoke"></div></div>
        </div>
        <svg class="cake" viewBox="0 0 300 220" aria-hidden="true">
          <defs>
            <linearGradient id="g-top" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#ffd6e6"/><stop offset="1" stop-color="#f7a8c6"/></linearGradient>
            <linearGradient id="g-low" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#fff1dc"/><stop offset="1" stop-color="#f3d2a8"/></linearGradient>
          </defs>
          <ellipse cx="150" cy="205" rx="140" ry="13" fill="#e9e3ff" opacity=".9"/>
          <!-- 下层 -->
          <rect x="35" y="115" width="230" height="88" rx="10" fill="url(#g-low)"/>
          <path d="M35 125 q0 -10 10 -10 h210 q10 0 10 10 v8 q-12 14 -24 0 q-12 14 -24 0 q-12 16 -24 0 q-12 14 -24 0 q-12 16 -24 0 q-12 14 -24 0 q-12 16 -24 0 q-12 14 -24 0 q-12 14 -24 0 q-10 12 -18 2z" fill="#f7a8c6"/>
          <!-- 上层 -->
          <rect x="70" y="50" width="160" height="70" rx="10" fill="url(#g-top)"/>
          <path d="M70 60 q0 -10 10 -10 h140 q10 0 10 10 v6 q-10 12 -20 0 q-10 14 -20 0 q-10 12 -20 0 q-10 14 -20 0 q-10 12 -20 0 q-10 14 -20 0 q-10 12 -20 0 q-10 10 -10 0z" fill="#fff6fb"/>
          <!-- 糖粒 -->
          <g opacity=".9">
            <rect x="90" y="88" width="8" height="3" rx="1.5" fill="#8fd3ff" transform="rotate(30 94 89)"/>
            <rect x="130" y="98" width="8" height="3" rx="1.5" fill="#ffe27a" transform="rotate(-20 134 99)"/>
            <rect x="170" y="86" width="8" height="3" rx="1.5" fill="#b59cff" transform="rotate(60 174 87)"/>
            <rect x="205" y="100" width="8" height="3" rx="1.5" fill="#8fd3ff" transform="rotate(-40 209 101)"/>
            <rect x="60" y="160" width="8" height="3" rx="1.5" fill="#b59cff" transform="rotate(20 64 161)"/>
            <rect x="110" y="175" width="8" height="3" rx="1.5" fill="#ff8fb1" transform="rotate(-30 114 176)"/>
            <rect x="160" y="158" width="8" height="3" rx="1.5" fill="#8fd3ff" transform="rotate(45 164 159)"/>
            <rect x="215" y="172" width="8" height="3" rx="1.5" fill="#ffe27a" transform="rotate(-10 219 173)"/>
            <rect x="240" y="150" width="8" height="3" rx="1.5" fill="#ff8fb1" transform="rotate(70 244 151)"/>
          </g>
          <!-- 爱心 -->
          <path d="M150 168 c-10 -8 -18 -14 -18 -22 a9 9 0 0 1 18 -3 a9 9 0 0 1 18 3 c0 8 -8 14 -18 22z" fill="#e8436b"/>
        </svg>
        </div>
        <p class="cake-hint" id="cake-hint"></p>
        <button class="mic-btn" id="mic-btn"></button>
      </div>
      <div class="final" id="final">
        <h2 class="final-wish" id="final-wish"></h2>
        <p class="final-sub" id="final-sub"></p>
      </div>
    </section>
  </main>

  <canvas id="confetti" aria-hidden="true"></canvas>

  <!-- 爱心蜡封图形 -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <radialGradient id="wax" cx="40%" cy="35%" r="70%">
        <stop offset="0" stop-color="#ff6b8b"/>
        <stop offset=".55" stop-color="#c8183f"/>
        <stop offset="1" stop-color="#7d0a24"/>
      </radialGradient>
      <symbol id="heart-seal" viewBox="0 0 100 100">
        <path d="M50 4 C62 2 70 10 78 12 C90 15 97 26 95 38 C99 50 94 60 96 70 C93 84 82 92 70 93 C60 99 46 97 36 95 C22 96 10 88 7 76 C2 64 6 54 4 44 C3 30 12 18 24 13 C33 8 41 6 50 4Z" fill="url(#wax)"/>
        <circle cx="50" cy="50" r="33" fill="none" stroke="#7d0a24" stroke-width="2" opacity=".55"/>
        <path d="M50 71 C33 58 26 50 26 41 A11 11 0 0 1 50 36 A11 11 0 0 1 74 41 C74 50 67 58 50 71Z" fill="#9e0f30" opacity=".85"/>
        <path d="M50 68 C35 57 29 50 29 42 A9.5 9.5 0 0 1 50 38" fill="none" stroke="#ff9db2" stroke-width="2" opacity=".6"/>
      </symbol>
    </defs>
  </svg>

  <script src="content.js"></script>
  <script src="js/vendor/gsap.min.js"></script>
  <script src="js/vendor/ScrollTrigger.min.js"></script>
  <script src="js/sky.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
